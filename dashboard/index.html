<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Live GitHub portfolio dashboard for Mortuza Shahariar" />
  <title>Mortuza Shahariar | GitHub Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">Live GitHub data</p>
      <h1>Mortuza Shahariar</h1>
      <p class="intro">Public repository activity and language portfolio, refreshed directly from the GitHub API.</p>
    </header>

    <p id="status" class="status" role="status">Loading public GitHub data...</p>

    <section id="metrics" class="metrics" aria-label="GitHub profile metrics"></section>

    <section class="visuals" aria-label="GitHub language portfolio">
      <article class="panel">
        <h2>Primary languages by repository</h2>
        <div id="donut" class="donut-wrap" aria-live="polite"></div>
      </article>
      <article class="panel">
        <h2>Language distribution</h2>
        <div id="bars" class="bars" aria-live="polite"></div>
      </article>
    </section>

    <section class="panel repository-panel">
      <div class="section-heading">
        <h2>Recently updated repositories</h2>
        <a href="https://github.com/shahariar007?tab=repositories" target="_blank" rel="noreferrer">View all on GitHub</a>
      </div>
      <div id="repositories" class="repository-list" aria-live="polite"></div>
    </section>

    <p id="updated" class="updated"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
